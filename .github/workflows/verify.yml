name: Verificar HCOP JP

on:
  push:
    branches: ["main", "master", "codex/**", "agent/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Publicar la imagen GHCR después de aprobar todas las pruebas"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HCOP_DB_PASSWORD: hcop-ci-db-${{ github.run_id }}-${{ github.run_attempt }}
  HCOP_BOOTSTRAP_PASSWORD: hcop-ci-login-${{ github.run_id }}-${{ github.run_attempt }}
  HCOP_QR_SECRET: hcop-ci-qr-${{ github.run_id }}-${{ github.run_attempt }}-not-production
  HCOP_ENCRYPTION_SECRET: hcop-ci-encryption-${{ github.run_id }}-${{ github.run_attempt }}-not-production

jobs:
  launcher:
    name: Lanzador Docker para Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar primer inicio y errores esperados de Docker
        shell: powershell
        run: .\scripts\test-github-launcher.ps1

  java:
    name: Compilacion y pruebas Java (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode -f backend/pom.xml verify

  frontend:
    name: Compilacion y pruebas Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci && npm test && npm run build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  docker:
    name: Producto Docker integral
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Construir e iniciar
        run: docker compose up --build --wait
      - name: Verificar salud
        run: curl --fail --silent --show-error http://127.0.0.1:5180/actuator/health
      - name: Verificar redirects y estáticos servidos por nginx
        shell: pwsh
        run: ./scripts/nginx-routing-test.ps1
      - name: Verificar aplicacion y Centro de configuracion
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Verificar catálogo OpenAPI documentado
        shell: pwsh
        run: ./scripts/generate-api-docs.ps1 -Check
      - name: Verificar documentación y enlaces
        shell: pwsh
        run: ./scripts/verify-documentation.ps1
      - name: Verificar contrato hexagonal de Configuración
        shell: pwsh
        run: ./scripts/configuration-contract-test.ps1
      - name: Verificar contrato hexagonal de Protocolos
        shell: pwsh
        run: ./scripts/protocol-contract-test.ps1
      - name: Verificar contrato hexagonal de Guías
        shell: pwsh
        run: ./scripts/guide-contract-test.ps1
      - name: Recorrer el flujo clínico integral
        shell: pwsh
        run: ./scripts/integration-test.ps1
      - name: Verificar backup y restauración exactos
        shell: pwsh
        run: ./scripts/test-backup-restore.ps1 -BackendImage hcop-jp-backend:local
      - name: Diagnostico ante fallos
        if: failure()
        run: docker compose logs --no-color
      - name: Detener
        if: always()
        run: docker compose down --volumes

  browser:
    name: Circuitos esenciales en navegador
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verificar sesión, historia, Configuración y turnero
        shell: pwsh
        run: ./scripts/test-core-browser-e2e.ps1 -SkipInstall
      - name: Conservar evidencia ante fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/e2e-artifacts/browser
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publicar imagen verificada (${{ matrix.service }})
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/codex/angular-hexagonal-migration' ||
         github.ref == 'refs/heads/codex/angular-full-parity-v2')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_image)
    needs: [launcher, java, frontend, docker, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            image: ghcr.io/marcolyto/hcop_jp-backend
          - service: frontend
            context: ./frontend
            image: ghcr.io/marcolyto/hcop_jp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=angular-hexagonal-migration,enable=${{ github.ref == 'refs/heads/codex/angular-hexagonal-migration' }}
            type=raw,value=angular-full-parity-v2,enable=${{ github.ref == 'refs/heads/codex/angular-full-parity-v2' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
