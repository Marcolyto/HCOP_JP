name: Verificar HCOP JP

on:
  push:
    branches: ["main", "master", "codex/**", "agent/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Publicar la imagen GHCR después de aprobar todas las pruebas"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  java:
    name: Compilacion y pruebas Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  docker:
    name: Producto Docker integral
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Construir e iniciar
        run: docker compose up --build --wait
      - name: Verificar salud
        run: curl --fail --silent --show-error http://127.0.0.1:5180/actuator/health
      - name: Verificar aplicacion y Centro de configuracion
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Verificar catálogo OpenAPI documentado
        shell: pwsh
        run: ./scripts/generate-api-docs.ps1 -Check
      - name: Verificar documentación y enlaces
        shell: pwsh
        run: ./scripts/verify-documentation.ps1
      - name: Recorrer el flujo clínico integral
        shell: pwsh
        run: ./scripts/integration-test.ps1
      - name: Diagnostico ante fallos
        if: failure()
        run: docker compose logs --no-color
      - name: Detener
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publicar imagen verificada
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_image)
    needs: [java, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/marcolyto/hcop_jp
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
