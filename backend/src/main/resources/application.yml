server:
  port: ${HCOP_PORT:5180}
  address: ${HCOP_BIND_ADDRESS:0.0.0.0}
  shutdown: graceful
  forward-headers-strategy: native
  servlet:
    session:
      persistent: false
    encoding:
      charset: UTF-8
      force: true
spring:
  application:
    name: hcop-jp
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${HCOP_DB_URL:jdbc:postgresql://127.0.0.1:5433/hcop_jp}
    username: ${HCOP_DB_USER:hcop}
    password: ${HCOP_DB_PASSWORD:hcop_local_change_me}
    hikari:
      maximum-pool-size: ${HCOP_DB_POOL_MAX:16}
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
      leak-detection-threshold: 30000
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 260MB
      file-size-threshold: 2MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    persist-authorization: false
    try-it-out-enabled: true
  show-actuator: false
hcop:
  runtime-root: ${HCOP_RUNTIME_ROOT:./runtime}
  catalog-root: ${HCOP_CATALOG_ROOT:${hcop.runtime-root}/catalogs}
  storage-root: ${HCOP_STORAGE_ROOT:${hcop.runtime-root}/storage}
  public-base-url: ${HCOP_PUBLIC_BASE_URL:http://127.0.0.1:5180}
  session-cookie-name: HCOP_SESSION
  session-duration-minutes: ${HCOP_SESSION_MINUTES:43200}
  max-study-bytes: 262144000
  max-image-bytes: 15728640
  qr-secret: ${HCOP_QR_SECRET:hcop-jp-local-qr-change-me}
  encryption-secret: ${HCOP_ENCRYPTION_SECRET:${HCOP_QR_SECRET:hcop-jp-local-qr-change-me}}
