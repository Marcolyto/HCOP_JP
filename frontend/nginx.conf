# nginx del servicio frontend. Sirve la SPA Angular y los estáticos que antes vivían en el JAR,
# y proxea /api (y los endpoints técnicos) al BFF. Corte F1: el BFF entra como Token Handler de
# la sesión — mismo contrato para Angular, la cookie que ve el navegador pasa a ser BFF_SESSION.
upstream api_upstream {
    server bff:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    # nginx no conoce el mapeo de puerto de Docker (escucha 8080 adentro, el host publica
    # 5180 afuera). Sin esto, los redirects locales (return 302 /app/;) se absolutizan con
    # el puerto interno y quedan rotos para quien entra por 5180. Location queda relativo
    # (solo el path), válido y resuelto correctamente por cualquier cliente HTTP moderno.
    absolute_redirect off;

    client_max_body_size 300m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Comunes a TODO proxy_pass de este server (se heredan salvo que una location las
    # redefina). Sin esto, nginx manda como Host el nombre del upstream ("api_upstream"),
    # que Tomcat rechaza con 400 por el guion bajo (no es válido en un nombre de dominio).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ---------- API: /api → backend (F0) / bff (F1) ----------
    # proxy_pass SIN URI final: nginx pasa $request_uri crudo y preserva %2F / %20.
    # NUNCA escribir "proxy_pass http://api_upstream/;" (normaliza y decodifica la URI y rompe
    # identificadores reales como "tx 17/165" codificados como tx%2017%2F165).
    location /api/ {
        proxy_pass http://api_upstream;
    }

    # ---------- Salud, OpenAPI y Swagger (mismo origen) ----------
    location = /actuator/health { proxy_pass http://api_upstream; access_log off; }
    location /v3/api-docs       { proxy_pass http://api_upstream; }
    location = /swagger-ui.html { proxy_pass http://api_upstream; }
    location /swagger-ui/       { proxy_pass http://api_upstream; }
    location /webjars/          { proxy_pass http://api_upstream; }
    location = /healthz         { access_log off; return 200 "ok\n"; }

    # ---------- Redirects legacy migrados de WebConfiguration.java ----------
    location = /                          { return 302 /app/; }
    location = /index.html                { return 302 /app/; }
    location = /app                       { return 302 /app/; }
    location = /configuration             { return 302 "/app/#/configuration"; }
    location = /configuration/            { return 302 "/app/#/configuration"; }
    location = /configuration/index.html  { return 302 "/app/#/configuration"; }
    location = /protocol-admin            { return 302 "/app/#/configuration?tab=protocols"; }
    location = /protocol-admin/           { return 302 "/app/#/configuration?tab=protocols"; }
    location = /protocol-admin/index.html { return 302 "/app/#/configuration?tab=protocols"; }
    location = /herramientas              { return 302 "/app/#/herramientas"; }
    location = /herramientas/             { return 302 "/app/#/herramientas"; }
    location = /herramientas/index.html   { return 302 "/app/#/herramientas"; }
    location = /docs                      { return 302 /docs/index.html; }
    location = /docs/                     { return 302 /docs/index.html; }

    # ---------- SPA Angular bajo /app/ ----------
    location = /app/index.html { add_header Cache-Control "no-store" always; }
    location ~* ^/app/.+\.(?:js|css|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
    location /app/ { try_files $uri $uri/ /app/index.html; }

    # ---------- Activos migrados desde el JAR ----------
    location /assets/     { expires 30d; add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    location /help/media/ { expires 7d; try_files $uri =404; }
    location /docs/       { try_files $uri $uri/index.html =404; }

    # ---------- Todo lo demás: 404 (los legacy dejan de existir) ----------
    location / { return 404; }
}
