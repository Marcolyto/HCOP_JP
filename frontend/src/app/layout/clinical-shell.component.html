<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/patients" aria-label="HCOP AJP, inicio">
      <span class="brand-mark">+</span>
      <span><strong>HCOP AJP</strong><small>piloto Angular</small></span>
    </a>

    <nav aria-label="Navegación principal">
      <a routerLink="/patients">Pacientes</a>
      @if (auth.session()?.activePatientId; as patientId) { <a [routerLink]="['/patients', patientId, 'history']">Historia</a> }
      <a href="/" title="Abrir la interfaz clínica vigente">Interfaz actual</a>
    </nav>

    <div class="user-actions">
      @if (auth.session()?.activePatientId; as patientId) {
        <span class="patient-chip">Paciente activo · {{ patientId }}</span>
      }
      <span class="user-name">{{ auth.session()?.user?.displayName || auth.session()?.user?.username }}</span>
      <button type="button" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main><router-outlet /></main>
</div>
